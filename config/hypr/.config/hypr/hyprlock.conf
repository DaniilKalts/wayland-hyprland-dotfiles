$font = JetBrainsMono Nerd Font
$font_bold = JetBrainsMono Nerd Font Bold
$accent = rgba(189, 147, 249, 0.8)
$surface = rgba(68, 71, 90, 0.8)
$foreground = rgb(248, 248, 242)
$error = rgb(255, 85, 85)

general {
    hide_cursor = true
    ignore_empty_input = true
    fractional_scaling = 2
    fail_timeout = 100
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/pictures/wallpapers/arch.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.7
}

input-field {
    monitor = DP-9
    size = 11%, 3.8%
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $foreground
    font_family = $font
    fade_on_empty = false
    rounding = 14
    placeholder_text = <span foreground="##f8f8f2">Password...</span>
    hide_input = false
    position = 0%, -5%
    halign = center
    valign = center
    check_color = $accent
    fail_color = $accent
    fail_text = <span size='1'>.</span>
}

label {
    monitor = DP-9
    text = cmd[update:1000] date +"%A, %B %d"
    color = $foreground
    font_size = 32
    font_family = $font
    position = 0%, 10%
    halign = center
    valign = center
}

label {
    monitor = DP-9
    text = cmd[update:1000] date +"%H:%M:%S"
    color = $foreground
    font_size = 140
    font_family = $font_bold
    position = 0%, 4%
    halign = center
    valign = center
}

label {
    monitor = DP-9
    text = cmd[update:100] [ "$FAIL" ] && echo "Incorrect password"
    color = $error
    font_size = 20
    font_family = $font
    position = 0%, -13.4%
    halign = center
    valign = center
}

