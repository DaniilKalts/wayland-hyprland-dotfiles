# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME

shell                     /usr/bin/zsh

font_family               JetBrainsMono NF
font_size                 16

cursor_shape              underline
cursor_blink_interval     0
cursor_stop_blinking_after 0

scrollback_lines          2000

copy_on_select            yes

mouse_hide_wait           0

select_by_word_characters @-./_~?&=%+#a

enable_audio_bell         no

remember_window_size      no

window_padding_width      10 4

map ctrl+c                copy_or_interrupt
map ctrl+v                paste_from_clipboard

map ctrl+y                launch --type=tab --cwd=current yazi
map shift+enter           send_text all \e\r

# pass ctrl+tab / ctrl+shift+tab through to herdr
map ctrl+tab no_op
map ctrl+shift+tab no_op
map ctrl+shift+t no_op
map ctrl+shift+r no_op
map ctrl+shift+1 no_op
map ctrl+shift+2 no_op
map ctrl+shift+3 no_op
map ctrl+shift+4 no_op
map ctrl+shift+5 no_op
map ctrl+shift+6 no_op
map ctrl+shift+7 no_op
map ctrl+shift+8 no_op
map ctrl+shift+9 no_op
